[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jinx-redteam"
version = "2.2.0"
description = "AI-agent red-team toolkit, organized by MITRE ATLAS"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xAsad" }]
keywords = ["security", "red-team", "ai-agent", "prompt-injection", "llm", "mitre-atlas"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Asadsaf/Jinx-AI"
Issues = "https://github.com/Asadsaf/Jinx-AI/issues"

[project.optional-dependencies]
browser = ["playwright>=1.40"]
atlas = ["pyyaml>=6"]

[project.scripts]
jinx = "jinx.__main__:main"

[tool.setuptools]
packages = ["jinx"]
